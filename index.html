<title>BARO التمساح</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at top, #492080 0%, transparent 48%),
    linear-gradient(145deg, #090414, #17082c 55%, #080310);
  overflow-x: hidden;
}

header {
  text-align: center;
  padding: 35px 15px 20px;
}

.logo {
  width: 105px;
  height: 105px;
  margin: auto;
  border-radius: 28px;
  display: grid;
  place-items: center;
  font-size: 57px;
  background: linear-gradient(145deg, #8c38ff, #32105f);
  border: 2px solid #c58cff;
  box-shadow: 0 0 25px #a13cff, inset 0 0 20px #ffffff20;
  animation: glow 3s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #9b43ff; }
  to { box-shadow: 0 0 38px #c17aff; }
}

h1 {
  margin-top: 20px;
  font-size: 30px;
  color: #d9b5ff;
  text-shadow: 0 0 15px #a64aff;
}

.subtitle {
  margin-top: 10px;
  color: #c8b6dc;
  font-size: 14px;
}

main {
  width: 90%;
  max-width: 480px;
  margin: 20px auto;
}

.panel {
  padding: 24px 18px;
  border-radius: 23px;
  background: #ffffff0b;
  border: 1px solid #a65aff66;
  box-shadow: 0 0 25px #8c35ff20;
  backdrop-filter: blur(12px);
}

.panel h2 {
  text-align: center;
  font-size: 20px;
  color: #d9b5ff;
  margin-bottom: 18px;
}

.search-box {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 13px;
  border: 1px solid #a75cff;
  outline: none;
  background: #10091e;
  color: white;
  font-size: 15px;
  text-align: left;
  direction: ltr;
}

input:focus {
  box-shadow: 0 0 15px #a34aff88;
}

button {
  border: none;
  border-radius: 13px;
  padding: 15px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(100deg, #7024c9, #b34dff);
  box-shadow: 0 0 17px #963cff55;
}

button:active {
  transform: scale(.98);
}

.note {
  text-align: center;
  color: #bba7d2;
  font-size: 12px;
  margin-top: 13px;
  line-height: 1.8;
}

.social {
  margin-top: 25px;
  text-align: center;
}

.social h2 {
  color: #d9b5ff;
  font-size: 19px;
  margin-bottom: 17px;
}

.social-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 13px;
}

.social-links a {
  width: 53px;
  height: 53px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  color: white;
  text-decoration: none;
  font-size: 24px;
  background: #ffffff12;
  border: 1px solid #b26bff88;
  transition: .25s;
}

.social-links a:hover {
  transform: translateY(-5px);
  background: #7d32c9;
  box-shadow: 0 0 20px #a64aff;
}

.social-links svg {
  width: 25px;
  height: 25px;
  fill: currentColor;
}

footer {
  text-align: center;
  padding: 25px 10px;
  color: #9d88b5;
  font-size: 12px;
}
</style>
</head>

<body>

<script>
function openSite() {
  let value = document.getElementById("siteUrl").value.trim();

  if (!value) {
    alert("اكتب رابط الموقع أولًا");
    return;
  }

  if (!/^https?:\/\//i.test(value)) {
    value = "https://" + value;
  }

  try {
    const url = new URL(value);

    if (url.protocol !== "http:" && url.protocol !== "https:") {
      throw new Error("Invalid protocol");
    }

    window.open(url.href, "_blank", "noopener,noreferrer");
  } catch (error) {
    alert("الرابط غير صحيح، راجعه وحاول مرة أخرى");
  }
}

document.getElementById("siteUrl").addEventListener("keydown", function(e) {
  if (e.key === "Enter") openSite();
});
</script>
